server:
  port: 8080

spring:
  application:
    name: gamermatch

  datasource:
    url: jdbc:h2:mem:gamermatch;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  sql:
    init:
      mode: always

  h2:
    console:
      enabled: true
      path: /h2-console

  data:
    redis:
      host: localhost
      port: 6379
    mongodb:
      uri: mongodb://localhost:27017/gamermatch

# Gomulu MongoDB - ilk calistirmada binary indirir, gercek Mongo motoru
de:
  flapdoodle:
    mongodb:
      embedded:
        version: 6.0.11
