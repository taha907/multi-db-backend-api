server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: gateway-service

  cloud:
    gateway:
      routes:
        - id: health
          uri: ${USER_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/health

        - id: users-and-teams
          uri: ${USER_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/users/**,/api/teams/**

        - id: tournaments
          uri: ${TOURNAMENT_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/tournaments/**

        - id: matchmaking
          uri: ${MATCHMAKING_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/matchmaking/**

        - id: reports
          uri: ${REPORT_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/match-reports/**
